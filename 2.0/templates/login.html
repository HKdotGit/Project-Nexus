<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Sign In</title>
    <meta name="description" content="Sign in to Nexus, your NMIMS AI assistant.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Nexus light theme background */
            overflow: hidden;
            color: #333;
        }

        /* Card */
        .card {
            position: relative;
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-area .brand {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #d32f2f, #ff5252, #b71c1c); /* Nexus brand red */
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 4s ease infinite;
        }
        @keyframes gradShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .logo-area .tagline {
            color: #777;
            font-size: 13px;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.04);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 32px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #555;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #d32f2f, #ff5252);
            color: white;
            box-shadow: 0 4px 14px rgba(211,47,47,0.3);
        }

        /* Form */
        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeUp 0.3s ease forwards; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            color: #333;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }
        .field input::placeholder { color: #aaa; }
        .field input:focus {
            border-color: rgba(211,47,47,0.5);
            background: white;
            box-shadow: 0 0 0 3px rgba(211,47,47,0.1);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d32f2f 0%, #ff5252 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(211,47,47,0.25);
        }
        .submit-btn:hover   { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(211,47,47,0.35); }
        .submit-btn:active  { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; pointer-events: none; }

        /* Error / success */
        .msg-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .msg-box.error   { background: rgba(229,57,53,0.1); color: #d32f2f; border: 1px solid rgba(229,57,53,0.2); display: block; }
        .msg-box.success { background: rgba(67,160,71,0.1); color: #2e7d32; border: 1px solid rgba(67,160,71,0.2); display: block; }

        /* Divider */
        .divider {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin: 8px 0 4px;
        }

        /* Netflix-style Splash Screen */
        .netflix-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none; /* Allows clicking through if JS ever stalls */
            animation: fadeOutSplash 0.5s ease-in 3.5s forwards;
        }

        .netflix-text {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #e50914; /* Netflix Red */
            transform: scale(0.5);
            opacity: 0;
            animation: netflixZoom 3.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.8);
        }

        @keyframes netflixZoom {
            0% { transform: scale(3); opacity: 0; filter: blur(10px); }
            20% { transform: scale(1); opacity: 1; filter: blur(0px); }
            80% { transform: scale(1.15); opacity: 1; filter: blur(0px); }
            100% { transform: scale(2.5); opacity: 0; filter: blur(10px); }
        }

        @keyframes fadeOutSplash {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

<!-- Netflix-style Splash Screen -->
<div class="netflix-splash" id="splashScreen">
    <div class="netflix-text">NEXUS</div>
</div>

<div class="card">
    <div class="logo-area">
        <div class="brand">NEXUS</div>
        <div class="tagline">NMIMS AI ASSISTANT</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabSignIn"  onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn"        id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Sign In -->
    <div class="form-panel active" id="panelSignin">
        <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="submit-btn" id="loginBtn" onclick="doLogin()">Sign In →</button>
        <div class="msg-box" id="loginMsg"></div>
    </div>

    <!-- Register -->
    <div class="form-panel" id="panelRegister">
        <div class="field">
            <label>Username</label>
            <input type="text" id="regUsername" placeholder="e.g. kavya_shah" autocomplete="username">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Min 6 characters" autocomplete="new-password">
        </div>
        <button class="submit-btn" id="registerBtn" onclick="doRegister()">Create Account →</button>
        <div class="msg-box" id="registerMsg"></div>
    </div>
</div>

<script>
    // If already logged in, go straight to the app
    if (localStorage.getItem('nexus_token')) {
        window.location.href = '/';
    }

    function switchTab(tab) {
        document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        document.getElementById('panelSignin').classList.toggle('active', tab === 'signin');
        document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `msg-box ${type}`;
    }

    async function doLogin() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return showMsg('loginMsg', 'Please fill in all fields.', 'error');

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const formData = new FormData();
        formData.append('email', email);
        formData.append('password', password);

        try {
            const res  = await fetch('/auth/login', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) {
                showMsg('loginMsg', data.detail || 'Login failed.', 'error');
            } else {
                localStorage.setItem('nexus_token', data.token);
                localStorage.setItem('nexus_user',  JSON.stringify(data.user));
                showMsg('loginMsg', '✓ Welcome back, ' + data.user.username + '!', 'success');
                setTimeout(() => window.location.href = '/', 600);
            }
        } catch {
            showMsg('loginMsg', 'Cannot connect to server.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In →';
        }
    }

    async function doRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!username || !email || !password) return showMsg('registerMsg', 'Please fill in all fields.', 'error');
        if (password.length < 6) return showMsg('registerMsg', 'Password must be at least 6 characters.', 'error');

        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = 'Creating account…';

        const formData = new FormData();
        formData.append('username', username);
        formData.append('email', email);
        formData.append('password', password);

        try {
            const res  = await fetch('/auth/register', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) {
                showMsg('registerMsg', data.detail || 'Registration failed.', 'error');
            } else {
                showMsg('registerMsg', '✓ Account created! Please sign in.', 'success');
                setTimeout(() => {
                    document.getElementById('loginEmail').value = email;
                    switchTab('signin');
                }, 1500);
            }
        } catch {
            showMsg('registerMsg', 'Cannot connect to server.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account →';
        }
    }

    // Splash Screen Logic
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if(splash) {
                splash.classList.add('hidden');
                setTimeout(() => splash.style.display = 'none', 1000);
            }
        }, 3500); // 3.5s netflix animation time
    });

    // Enter key on inputs
    document.addEventListener('keypress', (e) => {
        if (e.key !== 'Enter') return;
        if (document.getElementById('panelSignin').classList.contains('active')) doLogin();
        else doRegister();
    });
</script>
</body>
</html>
